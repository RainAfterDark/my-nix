name: "shoko"
services:
  shoko_server:
    shm_size: 256m
    container_name: shoko_server
    image: ghcr.io/shokoanime/server:latest
    restart: always
    environment:
      - "PUID=1000"
      - "PGID=100"
      - "TZ=Asia/Manila"
    ports:
      - "8111:8111"
    volumes:
      - "/home/ame/.shoko-config:/home/shoko/.shoko"
      - "/mnt/hdd/_Anime:/mnt/anime:ro"
[bar.default]
background_opacity = 0.79999998211860657
center = [ "workspaces" ]
end = [ "tray", "network", "bluetooth", "volume", "brightness", "battery", "notifications" ]
font_weight = 600
margin_edge = 8
margin_ends = 8
radius = 0
start = [ "Vicinae", "clock", "active_window", "audio_visualizer" ]

[desktop_widgets]
enabled = false

[dock]
radius = 0

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-login-box@DP-3",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 957.0
    output = "DP-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 957.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 128.0
    box_width = 272.0
    cx = 960.0
    cy = 524.0
    output = "DP-3"
    rotation = 0.0
    type = "clock"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 48.0
    box_width = 160.0
    cx = 960.0
    cy = 628.0
    output = "DP-3"
    rotation = 0.0
    type = "weather"

[notification]
offset_x = 4
offset_y = 0
scale = 0.85000000521540642

[osd]
background_opacity = 0.99999997764825821
offset_y = 0
position = "bottom_center"

[shell]
corner_radius_scale = 0.0
font_family = "Maple Mono Normal NF CN"
password_style = "random"
screen_time_enabled = true

    [shell.screen_corners]
    size = 1

    [shell.shadow]
    direction = "center"

[theme]
builtin = "Kanagawa"

[wallpaper]
enabled = false

[widget.Vicinae]
command = "vicinae toggle"
glyph = "apps"
type = "custom_button"

[widget.active_window]
capsule = true

[widget.audio_visualizer]
color_2 = "tertiary"
mirrored = false

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.tray]
drawer = true

[widget.workspaces]
display = "none"
empty_color = "tertiary"
